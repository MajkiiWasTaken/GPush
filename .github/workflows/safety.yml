name: Safety checks

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # WINDOWS / POWERSHELL
  # ============================================================

  windows-safety:
    name: PowerShell safety checks
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      WINDOWS_GP: ./windows/gp.ps1
      WINDOWS_INSTALLER: ./windows/install.ps1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ------------------------------------------------------------
      # 1. Verify expected files
      # ------------------------------------------------------------

      - name: Check Windows files exist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path $env:WINDOWS_GP)) {
              Write-Error "Windows GPush script not found: $env:WINDOWS_GP"
              exit 1
          }

          if (-not (Test-Path $env:WINDOWS_INSTALLER)) {
              Write-Error "Windows installer not found: $env:WINDOWS_INSTALLER"
              exit 1
          }

          Write-Host "Windows files found." -ForegroundColor Green

      # ------------------------------------------------------------
      # 2. Syntax check - Windows PowerShell 5.1
      # ------------------------------------------------------------

      - name: Check PowerShell 5.1 syntax
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $files = Get-ChildItem `
              -Path ./windows `
              -Filter *.ps1 `
              -Recurse

          foreach ($file in $files) {
              Write-Host "Checking $($file.FullName)"

              $tokens = $null
              $errors = $null

              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null

              if ($errors.Count -gt 0) {
                  $errors | ForEach-Object {
                      Write-Error $_.Message
                  }

                  exit 1
              }
          }

          Write-Host "PowerShell 5.1 syntax OK." -ForegroundColor Green

      # ------------------------------------------------------------
      # 3. Syntax check - PowerShell 7
      # ------------------------------------------------------------

      - name: Check PowerShell 7 syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = Get-ChildItem `
              -Path ./windows `
              -Filter *.ps1 `
              -Recurse

          foreach ($file in $files) {
              Write-Host "Checking $($file.FullName)"

              $tokens = $null
              $errors = $null

              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null

              if ($errors.Count -gt 0) {
                  $errors | ForEach-Object {
                      Write-Error $_.Message
                  }

                  exit 1
              }
          }

          Write-Host "PowerShell 7 syntax OK." -ForegroundColor Green

      # ------------------------------------------------------------
      # 4. PSScriptAnalyzer
      # ------------------------------------------------------------

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted

          Install-Module PSScriptAnalyzer `
              -Scope CurrentUser `
              -Force `
              -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $results = Invoke-ScriptAnalyzer `
              -Path ./windows `
              -Recurse `
              -Severity Error,Warning

          if ($results) {
              $results | Format-Table -AutoSize
          }

          $errors = @(
              $results | Where-Object {
                  $_.Severity -eq "Error"
              }
          )

          if ($errors.Count -gt 0) {
              Write-Error "PSScriptAnalyzer found errors."
              exit 1
          }

          Write-Host "PSScriptAnalyzer check OK." -ForegroundColor Green

      # ------------------------------------------------------------
      # 5. Dangerous PowerShell command detection
      # ------------------------------------------------------------

      - name: Detect dangerous PowerShell commands
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = Get-ChildItem `
              -Path ./windows `
              -Filter *.ps1 `
              -Recurse

          $dangerousPatterns = @(
              @{
                  Name = "Invoke-Expression"
                  Pattern = '\bInvoke-Expression\b|\biex\b'
              },
              @{
                  Name = "Encoded PowerShell command"
                  Pattern = '(?i)-EncodedCommand\b|-enc\b'
              },
              @{
                  Name = "Download and execute"
                  Pattern = '(?i)(Invoke-WebRequest|iwr|curl|wget).*(Invoke-Expression|iex)'
              },
              @{
                  Name = "Format disk"
                  Pattern = '(?i)\bFormat-Volume\b|\bClear-Disk\b'
              },
              @{
                  Name = "Partition deletion"
                  Pattern = '(?i)\bRemove-Partition\b'
              },
              @{
                  Name = "Mass file deletion"
                  Pattern = '(?i)Remove-Item\s+[^`r`n]*(-Recurse)[^`r`n]*(-Force)'
              },
              @{
                  Name = "Windows Defender exclusion"
                  Pattern = '(?i)Add-MpPreference.*Exclusion'
              },
              @{
                  Name = "Disable Defender"
                  Pattern = '(?i)Set-MpPreference.*Disable'
              },
              @{
                  Name = "Registry destruction"
                  Pattern = '(?i)Remove-Item\s+.*HKLM:'
              },
              @{
                  Name = "Computer shutdown/restart"
                  Pattern = '(?i)\bStop-Computer\b|\bRestart-Computer\b'
              },
              @{
                  Name = "Privilege elevation"
                  Pattern = '(?i)Start-Process.*-Verb\s+RunAs'
              }
          )

          $failed = $false

          foreach ($file in $files) {
              $content = Get-Content $file.FullName -Raw

              foreach ($rule in $dangerousPatterns) {
                  if ($content -match $rule.Pattern) {
                      Write-Host ""
                      Write-Host "Potentially dangerous command detected:" `
                          -ForegroundColor Red

                      Write-Host "  Rule: $($rule.Name)"
                      Write-Host "  File: $($file.FullName)"

                      $failed = $true
                  }
              }
          }

          if ($failed) {
              Write-Error "Safety check failed."
              exit 1
          }

          Write-Host "No dangerous commands detected." `
              -ForegroundColor Green

      # ------------------------------------------------------------
      # 6. Installer-specific safety
      # ------------------------------------------------------------

      - name: Check Windows installer behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path $env:WINDOWS_INSTALLER)) {
              Write-Error "Windows installer not found: $env:WINDOWS_INSTALLER"
              exit 1
          }

          $installer = Get-Content $env:WINDOWS_INSTALLER -Raw

          $forbidden = @(
              'HKLM:',
              'Program Files',
              'System32',
              'Set-ExecutionPolicy',
              'Start-Process.*RunAs',
              'New-Service',
              'sc.exe',
              'schtasks',
              'Register-ScheduledTask'
          )

          foreach ($pattern in $forbidden) {
              if ($installer -match $pattern) {
                  Write-Error "Forbidden installer behavior detected: $pattern"
                  exit 1
              }
          }

          Write-Host "Installer safety check OK." `
              -ForegroundColor Green

      # ------------------------------------------------------------
      # 7. gp.ps1 command scope
      # ------------------------------------------------------------

      - name: Check GPush PowerShell command scope
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path $env:WINDOWS_GP)) {
              Write-Error "Windows GPush script not found: $env:WINDOWS_GP"
              exit 1
          }

          $script = Get-Content $env:WINDOWS_GP -Raw

          $forbidden = @(
              'Format-Volume',
              'Clear-Disk',
              'Remove-Partition',
              'Stop-Computer',
              'Restart-Computer',
              'Set-ExecutionPolicy',
              'Add-MpPreference',
              'Set-MpPreference',
              'New-Service',
              'Register-ScheduledTask',
              'Invoke-Expression'
          )

          foreach ($command in $forbidden) {
              if ($script -match "\b$command\b") {
                  Write-Error "Forbidden command found in gp.ps1: $command"
                  exit 1
              }
          }

          Write-Host "GPush contains no system-destructive commands." `
              -ForegroundColor Green

  # ============================================================
  # LINUX / BASH
  # ============================================================

  linux-safety:
    name: Linux shell safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      LINUX_GP: ./linux/gp
      LINUX_INSTALLER: ./linux/install.sh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ------------------------------------------------------------
      # 1. Verify expected files
      # ------------------------------------------------------------

      - name: Check Linux files exist
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$LINUX_GP" ]]; then
            echo "Linux GPush script not found: $LINUX_GP"
            exit 1
          fi

          if [[ ! -f "$LINUX_INSTALLER" ]]; then
            echo "Linux installer not found: $LINUX_INSTALLER"
            exit 1
          fi

          echo "Linux files found."

      # ------------------------------------------------------------
      # 2. Bash syntax
      # ------------------------------------------------------------

      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          bash -n "$LINUX_GP"
          bash -n "$LINUX_INSTALLER"

          echo "Bash syntax OK."

      # ------------------------------------------------------------
      # 3. ShellCheck
      # ------------------------------------------------------------

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          shellcheck "$LINUX_GP"
          shellcheck "$LINUX_INSTALLER"

      # ------------------------------------------------------------
      # 4. Verify LF line endings
      # ------------------------------------------------------------

      - name: Check Linux line endings
        shell: bash
        run: |
          set -euo pipefail

          failed=false

          for file in "$LINUX_GP" "$LINUX_INSTALLER"; do
            if grep -q $'\r' "$file"; then
              echo "CRLF detected in: $file"
              failed=true
            fi
          done

          if [[ "$failed" == true ]]; then
            exit 1
          fi

          echo "Linux scripts use LF line endings."

      # ------------------------------------------------------------
      # 5. Dangerous shell command detection
      # ------------------------------------------------------------

      - name: Detect dangerous shell commands
        shell: bash
        run: |
          set -euo pipefail

          failed=false

          patterns=(
            'rm[[:space:]]+-rf[[:space:]]+/'
            'mkfs\.'
            'dd[[:space:]].*of=/dev/'
            'shutdown'
            'reboot'
            'poweroff'
            'systemctl[[:space:]]+(reboot|poweroff)'
            'chmod[[:space:]]+-R[[:space:]]+777[[:space:]]+/'
          )

          for file in "$LINUX_GP" "$LINUX_INSTALLER"; do
            for pattern in "${patterns[@]}"; do
              if grep -Eqi "$pattern" "$file"; then
                echo "Potentially dangerous command detected:"
                echo "  File: $file"
                echo "  Pattern: $pattern"
                failed=true
              fi
            done
          done

          if [[ "$failed" == true ]]; then
            exit 1
          fi

          echo "No dangerous shell commands detected."